if(t==='wash'){s.clean=clamp(s.clean+32);return msg('🫧 洗得乾乾淨淨！')}
if(t==='rest'){petReaction('sleepy');s.energy=clamp(s.energy+35);s.hp=Math.min(s.maxHp,s.hp+18);s.partyHP={};return msg('💤 睡了個好覺！')}
if(t==='pet'){petReaction('love');s.joy=clamp(s.joy+9);s.bond=clamp(s.bond+3);return msg('💕 皮卡丘蹭了蹭你的手！')}
if(t==='heal'){if(!s.potions)return msg('傷藥用完了！');s.potions--;s.hp=Math.min(s.maxHp,s.hp+30);return msg('🧪 恢復了 30 HP！')}}
function stat(name,v){return '<div><small>'+name+' '+Math.round(v)+'%</small><div class="bar"><div class="fill" style="width:'+clamp(v)+'%"></div></div></div>'}
function home(){return '<div class="panel"><b>皮卡丘 Lv.'+s.level+'</b> 💕 '+Math.round(s.bond)+'<p class="muted">HP '+s.hp+'/'+s.maxHp+' · 經驗 '+s.xp+'/'+s.level*25+'</p><div class="scene"><div>'+(s.hunger<25?'肚子餓了…':s.energy<20?'想睡覺…':'皮卡皮卡！')+'</div><div class="pet" onclick="act(\'pet\')">'+spriteMood(currentMood())+'</div><small>點皮卡丘摸摸牠</small></div><div class="bars">'+stat('🍎 飽足',s.hunger)+stat('💛 心情',s.joy)+stat('🫧 清潔',s.clean)+stat('💤 體力',s.energy)+'</div></div><div class="panel"><h3>照顧皮卡丘</h3><div class="actions"><button onclick="act(\'feed\')">🍎 餵食 ×'+s.food+'</button><button onclick="act(\'play\')">🎮 玩耍</button><button onclick="act(\'wash\')">🫧 洗澡</button><button onclick="act(\'rest\')">💤 休息</button><button onclick="act(\'pet\')">💕 摸摸</button><button onclick="act(\'heal\')">🧪 傷藥 ×'+s.potions+'</button></div></div>'}
const tiles=['🌲','🌲','🌳','🌲','🌲','🌳','🌿','🌿','🌳','🌲','🌿','🌿','🏠','🌿','🌿','🌲','🌿','🌿','🌿','🌳','🌲','🌲','🌿','🌳','🌲'];
function move(d){if(battle)return;let r=Math.floor(s.pos/5),c=s.pos%5;r+=d==='up'?-1:d==='down'?1:0;c+=d==='left'?-1:d==='right'?1:0;if(r<0||r>4||c<0||c>4)return msg('前面已經是地圖邊界！');s.pos=r*5+c;s.steps++;s.energy=clamp(s.energy-2);s.hunger=clamp(s.hunger-1);if(s.pos!==12&&Math.random()<.38){let a=wildPokemon();battle={name:a[0],emoji:a[1],hp:a[2],max:a[2],atk:a[3],id:a[4]};tab='battle';s.message='野生的'+a[0]+'出現了！'}else s.message=s.pos===12?'回到寶可夢小屋！':'在草地中探索中…';save();render()}
function map(){const zone=zones[s.zone||0],regions=['關都','城都','豐緣'],selected=s.mapRegion||zone.region;return '<div class="panel"><h3>🗺️ 選擇冒險地區</h3><div class="region-tabs">'+regions.map(region=>'<button class="'+(selected===region?'selected':'')+'" onclick="switchRegion(\''+region+'\')">'+(region==='關都'?'🌿':region==='城都'?'🏯':'🌋')+' '+region+'</button>').join('')+'</div><h3>'+selected+'地區</h3><div class="zone-grid">'+zones.map((z,i)=>z.region===selected?'<button class="'+((s.zone||0)===i?'selected':'')+'" onclick="switchZone('+i+')">'+z.icon+' '+z.name+'</button>':'').join('')+'</div><p class="muted">目前探索：'+zone.name+' · '+zone.hint+'</p></div><div class="panel"><h3>'+zone.icon+' '+zone.name+' · 探索</h3><div class="map">'+Array.from({length:25},(_,i)=>'<div class="tile '+(i===s.pos?'current':'')+'">'+(i===s.pos?'⚡':i===12?'🏠':zone.tiles[i%zone.tiles.length])+'</div>').join('')+'</div><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:7px;max-width:240px;margin:14px auto"><span></span><button onclick="move(\'up\')">▲</button><span></span><button onclick="move(\'left\')">◀</button><button onclick="move(\'down\')">▼</button><button onclick="move(\'right\')">▶</button></div><p class="muted">步數 '+s.steps+' · 勝利 '+s.wins+'</p></div>'}
function fighterName(){return s.active&&s.party.includes(s.active)?s.active:'皮卡丘'}
function fighterId(name){return kantoNames.indexOf(name)+1}
function fighterLevel(name){return name==='皮卡丘'?Math.max(s.level,(s.training||{})[name]||1):((s.training||{})[name]||1)}
function fighterMax(name){return name==='皮卡丘'?s.maxHp:35+fighterLevel(name)*5}
function fighterHP(name){s.partyHP=s.partyHP||{};return name==='皮卡丘'?s.hp:Math.min(fighterMax(name),s.partyHP[name]??fighterMax(name))}
function setFighterHP(name,hp){if(name==='皮卡丘')s.hp=hp;else{s.partyHP=s.partyHP||{};s.partyHP[name]=hp}}
function switchFighter(name){if(!s.party.includes(name))return msg('尚未捕捉這隻寶可夢');if(fighterHP(name)<=0)return msg(name+' 已經失去戰鬥能力，請先休息');if(fighterName()===name)return msg(name+' 已經在場上');s.active=name;s.message='換上 '+name+'！';if(battle)enemy();save();render()}
function moveType(name){return pokemonTypes(fighterId(name))[0]||'一般'}
function healParty(){s.partyHP={};s.hp=s.maxHp;s.message='所有夥伴已恢復體力！';save();render()}
function enemy(){if(!battle)return;const name=fighterName();let attackType=pokemonTypes(battle.id)[0];let mult=effectiveness(attackType,fighterId(name));let n=Math.max(0,Math.floor((battle.atk+Math.floor(Math.random()*5)-3)*mult));setFighterHP(name,Math.max(0,fighterHP(name)-n));s.message+=' '+battle.name+' 反擊造成 '+n+' 傷害！';if(fighterHP(name)===0){let available=s.party.find(n=>fighterHP(n)>0);if(available){s.active=available;s.message+=' '+name+' 倒下了！自動換上 '+available+'。'}else{battle=null;tab='home';s.coins=Math.max(0,s.coins-15);s.message='全隊失去戰鬥能力，返回小屋休息。損失 15 金幣。';healParty();}}}
function fight(t){if(!battle)return;const name=fighterName();if(t==='run'){if(Math.random()<.8){battle=null;tab='map';return msg('成功逃跑了！')}s.message='逃跑失敗！';enemy();return msg(s.message)}
if(t==='ball'){if(!s.balls)return msg('精靈球不足！');s.balls--;if(Math.random()<(.22+.68*(1-battle.hp/battle.max))*((isLegendary(battle.id)?.25:1))){let caught=battle.name;if(!s.caught.includes(caught))s.caught.push(caught);if(!s.party.includes(caught))s.party.push(caught);s.training=s.training||{};if(!s.training[caught])s.training[caught]=1;s.coins+=15;xp(10);battle=null;tab='dex';return msg('🎉 成功捕捉 '+caught+'！獲得 15 金幣和 10 經驗！')}s.message='寶可夢掙脫了精靈球！';enemy();return msg(s.message)}
if(t==='special'&&name==='皮卡丘'&&s.energy<8)return msg('體力不足！');if(t==='special'&&name==='皮卡丘')s.energy=clamp(s.energy-8);
let attackType=t==='special'?moveType(name):'一般';let mult=effectiveness(attackType,battle.id);let level=fighterLevel(name);let n=Math.floor((t==='special'?12+level*1.5+Math.random()*8:7+level+Math.random()*6)*mult);battle.hp=Math.max(0,battle.hp-n);s.message=name+' 使用 '+(t==='special'?attackType+'系招式':'撞擊')+'，造成 '+n+' 傷害！'+(mult>1?' 效果絕佳！':mult===0?' 沒有效果！':mult<1?' 效果不太好…':'');
if(!battle.hp){s.coins+=20;xp(12);s.wins++;s.training=s.training||{};s.training[name]=(s.training[name]||1)+1;battle=null;tab='map';s.message+=' 勝利！獲得 20 金幣和 12 經驗！'}else enemy();msg(s.message)}
function combat(){if(!battle)return map();let name=fighterName(),id=fighterId(name),art=name==='皮卡丘'?pikaSprite:spriteHTML(id);return '<div class="panel"><h3>⚔️ 野生寶可夢對戰</h3><div class="battle"><div><b>'+battle.name+'</b><small> '+pokemonTypes(battle.id).join('/')+'</small><p>HP '+battle.hp+'/'+battle.max+'</p><div class="big">'+battle.emoji+'</div></div><div><div class="big">'+art+'</div><b>'+name+' Lv.'+fighterLevel(name)+'</b><p>HP '+fighterHP(name)+'/'+fighterMax(name)+'</p></div></div><div class="actions" style="margin-top:12px"><button onclick="fight(\'tackle\')">💥 撞擊</button><button onclick="fight(\'special\')">✨ '+moveType(name)+'系招式</button><button onclick="fight(\'ball\')">🔴 精靈球 ×'+s.balls+'</button><button onclick="fight(\'run\')">🏃 逃跑</button></div><h3>🔄 更換出戰夥伴</h3><div class="switch-grid">'+s.party.map(n=>'<button '+(fighterHP(n)<=0?'disabled':'')+' onclick="switchFighter(\''+n+'\')">'+(n===name?'▶ ':'')+n+'<small> HP '+fighterHP(n)+'/'+fighterMax(n)+'</small></button>').join('')+'</div></div>'}
function switchDexRegion(region){s.dexRegion=region;save();render()}
function dex(){const regions=[['關都',1,151],['城都',152,251],['豐緣',252,386]],current=regions.find(r=>r[0]===(s.dexRegion||'關都'))||regions[0],subset=species.filter(a=>a[4]>=current[1]&&a[4]<=current[2]);return '<div class="panel"><h3>📖 全國寶可夢圖鑑</h3><p>已捕捉 '+s.caught.length+'/386 種</p><div class="region-tabs">'+regions.map(r=>'<button class="'+(current[0]===r[0]?'selected':'')+'" onclick="switchDexRegion(\''+r[0]+'\')">'+r[0]+'</button>').join('')+'</div><p class="muted">'+current[0]+'：'+subset.filter(a=>s.caught.includes(a[0])).length+'/'+subset.length+' 種</p><div class="dex-grid">'+subset.map(a=>'<div class="dex-entry"><small>#'+String(a[4]).padStart(3,'0')+'</small>'+(s.caught.includes(a[0])?a[1]:'<div class="unknown">?</div>')+'<small>'+(s.caught.includes(a[0])?a[0]:'未捕捉')+'</small><small>'+pokemonTypes(a[4]).join('/')+'</small></div>').join('')+'</div></div>'}
function partners(){return '<div class="panel"><h3>🎒 我的寶可夢夥伴</h3><p class="muted">選擇出戰、訓練、增加親密度，或使用進化道具。</p><div class="partner-grid">'+s.party.map(name=>{let id=kantoNames.indexOf(name)+1;let lv=fighterLevel(name),choices=evolutionChoices(name);return '<div class="partner-card"><div class="partner-art">'+(name==='皮卡丘'?pikaSprite:spriteHTML(id))+'</div><b>'+name+'</b><small>'+pokemonTypes(id).join(' / ')+' · Lv.'+lv+'</small><small>HP '+fighterHP(name)+'/'+fighterMax(name)+'</small><small>💗 親密度 '+((s.friendship||{})[name]||0)+'/100</small><div class="partner-actions"><button onclick="switchFighter(\''+name+'\')">'+(fighterName()===name?'出戰中':'設為出戰')+'</button><button onclick="trainPokemon(\''+name+'\')">訓練 20🪙</button><button onclick="bondPokemon(\''+name+'\')">陪伴 25🪙</button>'+choices.map(r=>'<button '+(evoCan(name,r)?'':'disabled')+' onclick="performEvolution(\''+name+'\','+r.to+')">進化 '+evoRequirement(r)+'</button>').join('')+'</div></div>'}).join('')+'</div></div>'}
function buy(k){let price=k==='food'?15:k==='balls'?30:25;if(s.coins<price)return msg('金幣不足！');s.coins-=price;s[k]++;msg('購買成功！')}
function shop(){return '<div class="panel"><h3>🏪 道具商店</h3>'+[['food','🍎 樹果',15],['balls','🔴 精靈球',30],['potions','🧪 傷藥',25]].map(a=>'<div class="row"><b>'+a[1]+'</b><small>持有 '+s[a[0]]+'</small><button onclick="buy(\''+a[0]+'\')">🪙 '+a[2]+'</button></div>').join('')+'</div><div class="panel"><h3>💎 進化道具商店</h3><p class="muted">交換進化使用連結交換券。購買後在夥伴頁面使用。</p>'+Object.entries(evoItems).map(([name,item])=>'<div class="row"><div><b>'+name+'</b><small>'+item.desc+' · 持有 '+((s.evoItems||{})[name]||0)+'</small></div><button onclick="buyEvoItem(\''+name+'\')">🪙 '+item.price+'</button></div>').join('')+'</div><div class="panel"><h3>💾 自動存檔</h3><p class="muted">進度保存在此瀏覽器，無法跨裝置同步。</p><button onclick="reset()">重新開始遊戲</button></div>'}
function reset(){if(confirm('確定清除進度？')){s=fresh();battle=null;tab='home';msg('新的冒險開始了！')}}
function go(t){tab=t;render()}
function render(){if(tab==='battle'&&!battle)tab='map';el('coins').textContent=s.coins;el('main').innerHTML='<div class="notice">📢 '+s.message+'</div>'+(tab==='home'?home():tab==='map'?map():tab==='battle'?combat():tab==='dex'?dex():tab==='partners'?partners():shop());el('nav').innerHTML=[['home','🏠','照顧'],['map','🗺️','探索'],['battle','⚔️','對戰'],['partners','👥','夥伴'],['dex','📖','圖鑑'],['shop','🎒','商店']].map(a=>'<button class="'+(tab===a[0]?'active':'')+'" onclick="go(\''+a[0]+'\')">'+a[1]+'<br>'+a[2]+'</button>').join('')}
render();setInterval(()=>{if(tab==='home')render()},1100);
</script></html>
