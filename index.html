<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ffdb58"><title>皮卡丘電子雞・像素冒險</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5e6a9;color:#26354c;font-family:monospace}.app{max-width:480px;margin:auto;min-height:100dvh;background:#fff9df;border:4px solid #293b56}header{background:#ffdb58;padding:14px;display:flex;justify-content:space-between;align-items:center;border-bottom:4px solid #293b56}h1{font-size:19px;margin:0}main{padding:14px;min-height:70vh}.panel{border:3px solid #293b56;background:#fffdf0;box-shadow:3px 3px #b6aa82;padding:12px;margin-bottom:15px}.scene{height:205px;background:linear-gradient(#b8e8f8 65%,#8bce7e 65%);display:grid;place-content:center;text-align:center}.pet{width:155px;height:175px;margin:auto;cursor:pointer;animation:bob 2s infinite}.pet svg{width:100%;height:100%;filter:drop-shadow(3px 4px 0 #6c9c63)}.big svg{width:96px;height:115px;display:block}@keyframes bob{50%{transform:translateY(-8px)}}.bars{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.bar{height:12px;border:2px solid #293b56;background:#ddd}.fill{height:100%;background:#85c978}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}button{background:#ffe69b;border:2px solid #293b56;padding:11px 4px;font-family:inherit;font-weight:bold;color:#26354c;cursor:pointer;box-shadow:2px 2px #293b56}button:active{transform:translate(2px,2px);box-shadow:none}.nav{position:sticky;bottom:0;display:grid;grid-template-columns:repeat(5,1fr);gap:3px;background:#293b56;padding:6px}.nav button{font-size:11px;box-shadow:none;background:#fff8d6}.nav .active{background:#ffcc40}.notice{padding:10px;background:#e9f5d2;border:2px solid #293b56;margin-bottom:14px;font-size:12px}.muted{font-size:12px;line-height:1.6;color:#68717a}.map{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;background:#293b56;padding:3px}.tile{background:#90cf7a;aspect-ratio:1;display:grid;place-content:center;font-size:24px}.current{outline:3px solid yellow;outline-offset:-4px}.row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px dashed #aaa}.battle{background:linear-gradient(#b8e8f8 60%,#91d07c 60%);height:210px;display:flex;align-items:center;justify-content:space-around}.big{font-size:65px}footer{text-align:center;font-size:10px;padding:14px;color:#777}</style>
<div class="app"><header><div><h1>⚡ 皮卡丘電子雞</h1><small>PIXEL PET · 冒險第一章</small></div><b>🪙 <span id="coins"></span></b></header><main id="main"></main><nav id="nav" class="nav"></nav><footer>非官方粉絲製作原型 · 進度儲存在此瀏覽器</footer></div>
<script>
const pikaSprite="<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 48 48\" shape-rendering=\"crispEdges\" role=\"img\" aria-label=\"皮卡丘像素圖\"><path fill=\"#4b332a\" d=\"M5 2h4v3h3v4h2v6h-4v-3H8V9H6V6H4V3h1zM35 3h4v3h-2v4h-2v5h-4V9h2V6h2z\"/><path fill=\"#ffd33d\" stroke=\"#68442b\" stroke-width=\"1.3\" stroke-linejoin=\"miter\" d=\"M8 7h3v4h2v5h3v2h16v-3h3v-4h2V7h2v7h-2v6h-3v2h3v3h2v5h-2v4h-3v3h-3v3H17v-2h-4v-3h-3v-5H8v-5h3v-3h3v-3h-2v-5h-2z\"/><path fill=\"#ffdf55\" d=\"M17 20h14v4h3v9h-3v4H18v-3h-4v-9h3z\"/><path fill=\"#4b332a\" d=\"M16 22h4v5h-4zM29 22h4v5h-4z\"/><path fill=\"#ffffff\" d=\"M17 22h1v2h-1zM30 22h1v2h-1z\"/><path fill=\"#f35d60\" d=\"M11 28h6v5h-6zM32 28h6v5h-6z\"/><path fill=\"#674335\" d=\"M23 29h3v2h-3zM20 32h2v2h2v1h2v-1h2v-2h2v3h-2v2h-7v-2h-2v-3h1z\"/><path fill=\"#ffd33d\" stroke=\"#68442b\" stroke-width=\"1.2\" d=\"M12 35h5v5h-4v-2h-2zM31 35h5v3h-2v2h-4zM18 39h5v4h-7v-2h2zM27 39h5v2h2v2h-7z\"/><path fill=\"#68442b\" d=\"M14 16h3v2h-3zM32 16h3v2h-3z\"/><path fill=\"#ffd33d\" stroke=\"#68442b\" stroke-width=\"1.4\" d=\"M36 34h4v-4h-3v-5h5v-4h-3v-4h7v8h-4v5h4v4h-4v5h-6z\"/><path fill=\"#9a6234\" d=\"M36 34h4v-4h-3v-4h3v8h-2v4h-2z\"/></svg>";
const species=[['波波','🐦',30,8],['走路草','🌱',34,7],['小拉達','🐭',28,9],['綠毛蟲','🐛',26,6],['伊布','🦊',40,10]];
const fresh=()=>({coins:100,level:1,xp:0,hunger:82,joy:80,clean:90,energy:85,bond:15,hp:55,maxHp:55,potions:3,balls:5,food:4,pos:12,steps:0,caught:['皮卡丘'],party:['皮卡丘'],wins:0,last:Date.now(),message:'皮卡丘正期待和你一起冒險！'});
let s;try{s={...fresh(),...JSON.parse(localStorage.getItem('pikachu-pet-v1')||'{}')}}catch(e){s=fresh()}let tab='home',battle=null;
const el=id=>document.getElementById(id),clamp=n=>Math.max(0,Math.min(100,n));
function save(){s.last=Date.now();localStorage.setItem('pikachu-pet-v1',JSON.stringify(s))}
let hours=Math.min(48,Math.max(0,(Date.now()-s.last)/3600000));s.hunger=clamp(s.hunger-hours*3);s.joy=clamp(s.joy-hours*2);s.clean=clamp(s.clean-hours*1.5);s.energy=clamp(s.energy+hours*2);save();
function msg(t){s.message=t;save();render()}
function xp(n){s.xp+=n;if(s.xp>=s.level*25){s.xp-=s.level*25;s.level++;s.maxHp+=5;s.hp=s.maxHp;s.coins+=30;s.message='皮卡丘升級了！獎勵 30 金幣！'}}
let petMoodUntil=0,petMood='happy';
function spriteMood(mood){
  let svg=pikaSprite;
  const eyes={
    happy:'<path fill="#4b332a" d="M16 25h4v1h-4zM29 25h4v1h-4z"/>',
    sleepy:'<path fill="#4b332a" d="M16 25h4v1h-4zM29 25h4v1h-4z"/>',
    hungry:'<path fill="#4b332a" d="M16 23h4v4h-4zM29 23h4v4h-4z"/><path fill="#ffffff" d="M17 23h1v2h-1zM30 23h1v2h-1z"/>',
    love:'<path fill="#f34b75" d="M16 22h2v1h2v-1h2v3h-1v1h-1v1h-2v-1h-1v-1h-1zM28 22h2v1h2v-1h2v3h-1v1h-1v1h-2v-1h-1v-1h-1z"/>'
  };
  if(!eyes[mood])return svg;
  return svg.replace(/<path fill="#4b332a" d="M16 22h4v5h-4zM29 22h4v5h-4z"\/><path fill="#ffffff" d="M17 22h1v2h-1zM30 22h1v2h-1z"\/>/,eyes[mood]);
}
function currentMood(){if(Date.now()<petMoodUntil)return petMood;if(s.energy<25)return 'sleepy';if(s.hunger<30)return 'hungry';if(s.joy>75)return 'happy';return 'normal'}
function petReaction(m){petMood=m;petMoodUntil=Date.now()+2200}
function act(t){if(t==='feed'){petReaction('happy');if(!s.food)return msg('樹果用完了！');s.food--;s.hunger=clamp(s.hunger+25);s.bond=clamp(s.bond+3);return msg('🍎 皮卡丘開心地吃下樹果！')}
if(t==='play'){petReaction('happy');if(s.energy<12)return msg('皮卡丘太累了！');s.joy=clamp(s.joy+22);s.energy=clamp(s.energy-12);s.hunger=clamp(s.hunger-6);s.bond=clamp(s.bond+5);s.coins+=8;xp(5);return msg('🎮 玩得真開心！獲得 8 金幣與 5 經驗')}
if(t==='wash'){s.clean=clamp(s.clean+32);return msg('🫧 洗得乾乾淨淨！')}
if(t==='rest'){petReaction('sleepy');s.energy=clamp(s.energy+35);s.hp=Math.min(s.maxHp,s.hp+18);return msg('💤 睡了個好覺！')}
if(t==='pet'){petReaction('love');s.joy=clamp(s.joy+9);s.bond=clamp(s.bond+3);return msg('💕 皮卡丘蹭了蹭你的手！')}
if(t==='heal'){if(!s.potions)return msg('傷藥用完了！');s.potions--;s.hp=Math.min(s.maxHp,s.hp+30);return msg('🧪 恢復了 30 HP！')}}
function stat(name,v){return '<div><small>'+name+' '+Math.round(v)+'%</small><div class="bar"><div class="fill" style="width:'+clamp(v)+'%"></div></div></div>'}
function home(){return '<div class="panel"><b>皮卡丘 Lv.'+s.level+'</b> 💕 '+Math.round(s.bond)+'<p class="muted">HP '+s.hp+'/'+s.maxHp+' · 經驗 '+s.xp+'/'+s.level*25+'</p><div class="scene"><div>'+(s.hunger<25?'肚子餓了…':s.energy<20?'想睡覺…':'皮卡皮卡！')+'</div><div class="pet" onclick="act(\'pet\')">'+pikaSprite+'</div><small>點皮卡丘摸摸牠</small></div><div class="bars">'+stat('🍎 飽足',s.hunger)+stat('💛 心情',s.joy)+stat('🫧 清潔',s.clean)+stat('💤 體力',s.energy)+'</div></div><div class="panel"><h3>照顧皮卡丘</h3><div class="actions"><button onclick="act(\'feed\')">🍎 餵食 ×'+s.food+'</button><button onclick="act(\'play\')">🎮 玩耍</button><button onclick="act(\'wash\')">🫧 洗澡</button><button onclick="act(\'rest\')">💤 休息</button><button onclick="act(\'pet\')">💕 摸摸</button><button onclick="act(\'heal\')">🧪 傷藥 ×'+s.potions+'</button></div></div>'}
const tiles=['🌲','🌲','🌳','🌲','🌲','🌳','🌿','🌿','🌳','🌲','🌿','🌿','🏠','🌿','🌿','🌲','🌿','🌿','🌿','🌳','🌲','🌲','🌿','🌳','🌲'];
function move(d){if(battle)return;let r=Math.floor(s.pos/5),c=s.pos%5;r+=d==='up'?-1:d==='down'?1:0;c+=d==='left'?-1:d==='right'?1:0;if(r<0||r>4||c<0||c>4)return msg('前面已經是地圖邊界！');s.pos=r*5+c;s.steps++;s.energy=clamp(s.energy-2);s.hunger=clamp(s.hunger-1);if(s.pos!==12&&Math.random()<.38){let a=species[Math.floor(Math.random()*species.length)];battle={name:a[0],emoji:a[1],hp:a[2],max:a[2],atk:a[3]};tab='battle';s.message='野生的'+a[0]+'出現了！'}else s.message=s.pos===12?'回到寶可夢小屋！':'在草地中探索中…';save();render()}
function map(){return '<div class="panel"><h3>🌳 常青森林 · 探索</h3><p class="muted">用方向鍵探索草地，可能遇到野生寶可夢。🏠 是小屋。</p><div class="map">'+tiles.map((v,i)=>'<div class="tile '+(i===s.pos?'current':'')+'">'+(i===s.pos?'⚡':v)+'</div>').join('')+'</div><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:7px;max-width:240px;margin:14px auto"><span></span><button onclick="move(\'up\')">▲</button><span></span><button onclick="move(\'left\')">◀</button><button onclick="move(\'down\')">▼</button><button onclick="move(\'right\')">▶</button></div><p class="muted">步數 '+s.steps+' · 勝利 '+s.wins+'</p></div>'}
function enemy(){let n=Math.max(2,battle.atk+Math.floor(Math.random()*5)-3);s.hp=Math.max(0,s.hp-n);s.message+=' 敵方反擊造成 '+n+' 傷害！';if(s.hp===0){battle=null;tab='home';s.hp=Math.ceil(s.maxHp/2);s.coins=Math.max(0,s.coins-15);s.message='皮卡丘體力耗盡，回家休息了。損失 15 金幣。'}}
function fight(t){if(!battle)return;if(t==='run'){if(Math.random()<.8){battle=null;tab='map';return msg('成功逃跑了！')}s.message='逃跑失敗！';enemy();return msg(s.message)}
if(t==='ball'){if(!s.balls)return msg('精靈球不足！');s.balls--;if(Math.random()<.22+.68*(1-battle.hp/battle.max)){let name=battle.name;if(!s.caught.includes(name))s.caught.push(name);if(!s.party.includes(name))s.party.push(name);s.coins+=15;xp(10);battle=null;tab='dex';return msg('🎉 成功捕捉 '+name+'！獲得 15 金幣和 10 經驗！')}s.message='寶可夢掙脫了精靈球！';enemy();return msg(s.message)}
if(t==='thunder'&&s.energy<8)return msg('體力不足！');if(t==='thunder')s.energy=clamp(s.energy-8);let n=t==='thunder'?Math.floor(12+s.level*2+Math.random()*8):Math.floor(7+s.level+Math.random()*6);battle.hp=Math.max(0,battle.hp-n);s.message='造成 '+n+' 傷害！';if(!battle.hp){s.coins+=20;xp(12);s.wins++;battle=null;tab='map';s.message+=' 勝利！獲得 20 金幣和 12 經驗！'}else enemy();msg(s.message)}
function combat(){if(!battle)return map();return '<div class="panel"><h3>⚔️ 野生寶可夢對戰</h3><div class="battle"><div><b>'+battle.name+'</b><p>HP '+battle.hp+'/'+battle.max+'</p><div class="big">'+battle.emoji+'</div></div><div><div class="big">'+pikaSprite+'</div><b>皮卡丘 Lv.'+s.level+'</b><p>HP '+s.hp+'/'+s.maxHp+'</p></div></div><div class="actions" style="margin-top:12px"><button onclick="fight(\'tackle\')">💥 撞擊</button><button onclick="fight(\'thunder\')">⚡ 十萬伏特</button><button onclick="fight(\'ball\')">🔴 精靈球 ×'+s.balls+'</button><button onclick="fight(\'run\')">🏃 逃跑</button></div></div>'}
function dex(){return '<div class="panel"><h3>📖 寶可夢圖鑑</h3><p>已捕捉 '+s.caught.length+'/'+(species.length+1)+' 種</p>'+[['皮卡丘',''+pikaSprite+''],...species].map(a=>'<div class="row"><span style="font-size:27px">'+(s.caught.includes(a[0])?a[1]:'❔')+'</span><b>'+(s.caught.includes(a[0])?a[0]:'？？？')+'</b><small>'+(s.caught.includes(a[0])?'已捕捉':'未發現')+'</small></div>').join('')+'</div><div class="panel"><h3>🎒 夥伴隊伍</h3>'+s.party.join(' · ')+'</div>'}
function buy(k){let price=k==='food'?15:k==='balls'?30:25;if(s.coins<price)return msg('金幣不足！');s.coins-=price;s[k]++;msg('購買成功！')}
function shop(){return '<div class="panel"><h3>🏪 道具商店</h3>'+[['food','🍎 樹果',15],['balls','🔴 精靈球',30],['potions','🧪 傷藥',25]].map(a=>'<div class="row"><b>'+a[1]+'</b><small>持有 '+s[a[0]]+'</small><button onclick="buy(\''+a[0]+'\')">🪙 '+a[2]+'</button></div>').join('')+'</div><div class="panel"><h3>💾 自動存檔</h3><p class="muted">進度保存在此瀏覽器，無法跨裝置同步。</p><button onclick="reset()">重新開始遊戲</button></div>'}
function reset(){if(confirm('確定清除進度？')){s=fresh();battle=null;tab='home';msg('新的冒險開始了！')}}
function go(t){tab=t;render()}
function render(){if(tab==='battle'&&!battle)tab='map';el('coins').textContent=s.coins;el('main').innerHTML='<div class="notice">📢 '+s.message+'</div>'+(tab==='home'?home():tab==='map'?map():tab==='battle'?combat():tab==='dex'?dex():shop());el('nav').innerHTML=[['home','🏠','照顧'],['map','🗺️','探索'],['battle','⚔️','對戰'],['dex','📖','圖鑑'],['shop','🎒','商店']].map(a=>'<button class="'+(tab===a[0]?'active':'')+'" onclick="go(\''+a[0]+'\')">'+a[1]+'<br>'+a[2]+'</button>').join('')}
render();setInterval(()=>{if(tab==='home')render()},1100);
</script></html>
