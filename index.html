function evoCan(name,r){let lv=fighterLevel(name),items=s.evoItems||{},friend=(s.friendship||{})[name]||0;

if(r.kind==='tradeItem')return (items[r.need]||0)>0&&(items['連結交換券']||0)>0;
if(r.kind==='friend')return friend>=80;
if(r.kind==='friendDay')return friend>=80&&new Date().getHours()>=6&&new Date().getHours()<18;
if(r.kind==='friendNight')return friend>=80&&(new Date().getHours()<6||new Date().getHours()>=18);
return false}

function reset(){if(confirm('確定清除進度？')){s=fresh();battle=null;tab='home';msg('新的冒險開始了！')}}
function go(t){tab=t;render()}
function render(){if(tab==='battle'&&!battle)tab='map';el('coins').textContent=s.coins;el('main').innerHTML='<div class="notice">📢 '+s.message+'</div>'+(tab==='home'?home():tab==='map'?map():tab==='battle'?combat():tab==='dex'?dex():tab==='partners'?partners():tab==='league'?league():shop());el('nav').innerHTML=[['home','🏠','照顧'],['map','🗺️','探索'],['battle','⚔️','對戰'],['partners','👥','夥伴'],['league','🏆','聯盟'],['dex','📖','圖鑑'],['shop','🎒','商店']].map(a=>'<button class="'+(tab===a[0]?'active':'')+'" onclick="go(\''+a[0]+'\')">'+a[1]+'<br>'+a[2]+'</button>').join('')}
render();setInterval(()=>{if(tab==='home')render()},1100);
</script></html>
